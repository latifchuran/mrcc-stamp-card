<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRCC — Digital Stamp Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --ink:#0c0c0c;
    --paper:#f6f4ee;
    --green:#39ff88;
    --card:#151515;
    --card-line:#2a2a2a;
    --muted:#9a9a92;
    --gold:#c9a24a;
    --red:#ff6b6b;
    --display: 'Fraunces', serif;
    --body: 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 10%, rgba(57,255,136,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(201,162,74,0.05), transparent 45%),
      var(--ink);
    color:var(--paper);
    font-family:var(--body);
    min-height:100vh;
    padding:48px 20px 80px;
  }
  .wrap{max-width:1080px;margin:0 auto;}
  .eyebrow{
    font-size:11px; letter-spacing:0.28em; text-transform:uppercase;
    color:var(--green); margin-bottom:10px;
  }
  h1{
    font-family:var(--display); font-weight:500;
    font-size:clamp(26px,4.5vw,42px); margin:0 0 8px; letter-spacing:-0.01em;
  }
  .sub{ color:var(--muted); font-size:15px; max-width:600px; line-height:1.55; margin:0 0 36px; }
  .stage{ display:grid; grid-template-columns: 1.1fr 1fr; gap:36px; align-items:start; }
  @media (max-width:860px){ .stage{grid-template-columns:1fr;} }

  .panel-label{ font-size:11px; letter-spacing:0.22em; text-transform:uppercase; color:var(--muted); margin-bottom:14px; }

  /* ---------- POS panel ---------- */
  .pos-box{ width:100%; max-width:320px; background:var(--card); border:1px solid var(--card-line); padding:20px; margin-bottom:16px; }
  .pos-title{ font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
  .field-row{ display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
  .field-row label{ font-size:10.5px; color:var(--muted); letter-spacing:0.06em; text-transform:uppercase; }
  .field-row input{
    background:var(--ink); border:1px solid var(--card-line); color:var(--paper);
    padding:10px 12px; font-family:var(--body); font-size:13.5px; outline:none;
  }
  .field-row input:focus{ border-color:var(--green); }
  .field-row input.err{ border-color:var(--red); }
  .pos-list{ margin-top:14px; border-top:1px solid var(--card-line); }
  .pos-item{
    display:flex; align-items:center; justify-content:space-between; padding:9px 0;
    border-bottom:1px solid #202020; font-size:13px; cursor:pointer; user-select:none;
  }
  .pos-item-name{ display:flex; align-items:center; gap:10px; }
  .pos-check{ width:16px; height:16px; border:1.3px solid var(--card-line); display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .pos-item.checked .pos-check{ border-color:var(--green); background:rgba(57,255,136,0.12); }
  .pos-check svg{ width:10px; height:10px; opacity:0; }
  .pos-item.checked .pos-check svg{ opacity:1; }
  .pos-price{ color:var(--muted); font-variant-numeric:tabular-nums; }
  .pos-total-row{
    display:flex; justify-content:space-between; font-family:var(--display); font-size:16px; font-weight:600;
    margin-top:14px; padding-top:12px; border-top:1px solid var(--card-line);
  }

  /* ---------- Receipt ---------- */
  .receipt-panel{ display:flex; flex-direction:column; align-items:center; }
  .receipt{
    width:300px; background:var(--paper); color:var(--ink); font-family:'Inter',monospace;
    padding:26px 22px 22px; box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6); position:relative;
    clip-path: polygon(0% 0%, 100% 0%, 100% 98%, 95% 100%, 90% 98%, 85% 100%, 80% 98%, 75% 100%, 70% 98%, 65% 100%, 60% 98%, 55% 100%, 50% 98%, 45% 100%, 40% 98%, 35% 100%, 30% 98%, 25% 100%, 20% 98%, 15% 100%, 10% 98%, 5% 100%, 0% 98%);
  }
  .r-brand{ text-align:center; font-family:var(--display); font-size:20px; letter-spacing:0.02em; margin-bottom:2px; }
  .r-tag{ text-align:center; font-size:9px; letter-spacing:0.2em; text-transform:uppercase; color:#6b6b63; margin-bottom:16px; }
  .r-line{ border:none; border-top:1px dashed #b9b6ab; margin:12px 0; }
  .r-row{ display:flex; justify-content:space-between; font-size:12.5px; margin:3px 0; }
  .r-row.item{ font-weight:600; }
  .r-total{ display:flex; justify-content:space-between; font-family:var(--display); font-size:17px; font-weight:600; margin-top:10px; }
  .qr-block{ display:flex; flex-direction:column; align-items:center; margin-top:18px; padding-top:16px; }
  #qrcode{ padding:8px; background:#fff; border:1px solid #1c1c1c; }
  .qr-caption{ font-size:9.5px; letter-spacing:0.14em; text-transform:uppercase; color:#6b6b63; margin-top:8px; text-align:center; }

  .btn{
    background:var(--ink); color:var(--green); border:1px solid var(--green); font-family:var(--body);
    font-weight:600; font-size:12.5px; letter-spacing:0.08em; text-transform:uppercase;
    padding:13px 26px; cursor:pointer; transition: all .2s ease; text-align:center;
  }
  .btn:hover{ background:var(--green); color:var(--ink); }
  .btn:disabled{ opacity:0.3; cursor:default; background:var(--ink); color:var(--green); }
  .btn-full{ width:100%; margin-top:12px; }
  .btn-gold{ border-color:var(--gold); color:var(--gold); }
  .btn-gold:hover{ background:var(--gold); color:var(--ink); }
  .link-btn{ background:none; border:none; color:var(--muted); font-size:11px; text-decoration:underline; cursor:pointer; letter-spacing:0.04em; }
  .link-btn:hover{ color:var(--green); }

  /* ---------- Phone ---------- */
  .phone-panel{ display:flex; flex-direction:column; align-items:center; }
  .phone{ width:290px; height:592px; border-radius:34px; background:#000; padding:12px; box-shadow: 0 30px 60px -20px rgba(0,0,0,0.7), inset 0 0 0 1px #2a2a2a; position:relative; }
  .notch{ position:absolute; top:12px; left:50%; transform:translateX(-50%); width:110px; height:20px; background:#000; border-radius:0 0 14px 14px; z-index:5; }
  .screen{ width:100%; height:100%; background: linear-gradient(180deg, #101210, #0a0a0a); border-radius:24px; overflow:hidden; position:relative; display:flex; flex-direction:column; padding:34px 20px 22px; }
  .card-header{ text-align:center; margin-bottom:18px; }
  .card-brand{ font-family:var(--display); font-size:19px; letter-spacing:0.01em; }
  .card-member{ font-size:11px; color:var(--muted); margin-top:4px; }
  .card-name{ font-size:13px; color:var(--paper); margin-top:2px; font-weight:600; }

  .stamp-grid{ display:grid; grid-template-columns: repeat(5,1fr); gap:10px; margin: 6px 0 16px; }
  .stamp{ aspect-ratio:1; border-radius:50%; border:1.3px solid var(--card-line); display:flex; align-items:center; justify-content:center; font-size:13px; color:#3a3a3a; position:relative; background:var(--card); }
  .stamp svg{ width:16px; height:16px; opacity:0; transform:scale(0.4); }
  .stamp.filled{ border-color:var(--green); background:radial-gradient(circle at 30% 30%, rgba(57,255,136,0.18), var(--card)); }
  .stamp.filled svg{ opacity:1; transform:scale(1); transition: all .35s cubic-bezier(.34,1.56,.64,1); }
  .stamp.pop{ animation: pop .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop{ 0%{transform:scale(1);} 40%{transform:scale(1.18);} 100%{transform:scale(1);} }

  .progress-text{ text-align:center; font-size:12px; color:var(--muted); margin-bottom:16px; }
  .progress-text b{ color:var(--green); font-weight:600; }

  .reward-box{ border:1px solid var(--card-line); padding:16px 14px; text-align:center; margin-top:auto; transition: all .4s ease; }
  .reward-box.ready{ border-color:var(--gold); background: linear-gradient(180deg, rgba(201,162,74,0.09), transparent); }
  .reward-title{ font-family:var(--display); font-size:14.5px; margin-bottom:4px; }
  .reward-box.ready .reward-title{ color:var(--gold); }
  .reward-sub{ font-size:10.5px; color:var(--muted); line-height:1.5; }
  .status-note{ font-size:10.5px; color:var(--muted); text-align:center; margin-top:10px; line-height:1.5; }

  .flash{ position:absolute; inset:0; background:var(--green); opacity:0; pointer-events:none; z-index:10; }
  .flash.go{ animation: flash .45s ease; }
  @keyframes flash{ 0%{opacity:0;} 15%{opacity:0.5;} 100%{opacity:0;} }

  .not-found{ text-align:center; padding:40px 10px; }
  .not-found .nf-icon{ font-size:32px; margin-bottom:10px; }
  .not-found h3{ font-family:var(--display); font-size:16px; margin:0 0 8px; }
  .not-found p{ font-size:11.5px; color:var(--muted); line-height:1.6; margin:0 0 18px; }

  .footer-link{ margin-top:22px; text-align:center; }

  /* ---------- Test customer list ---------- */
  .testlist{ width:100%; max-width:320px; margin-top:24px; }
  .testlist-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .testlist-title{ font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); }
  .testlist-clear{ font-size:10.5px; color:var(--muted); background:none; border:none; text-decoration:underline; cursor:pointer; }
  .testlist-clear:hover{ color:var(--red); }
  .test-row{ display:flex; justify-content:space-between; align-items:center; border:1px solid var(--card-line); padding:10px 12px; margin-bottom:8px; font-size:12px; }
  .test-row-main{ display:flex; flex-direction:column; gap:2px; }
  .test-row-name{ font-weight:600; }
  .test-row-phone{ color:var(--muted); font-size:10.5px; }
  .test-row-stamps{ color:var(--green); font-size:11.5px; font-weight:600; white-space:nowrap; margin-left:10px; }
  .test-row-actions{ display:flex; gap:8px; margin-left:10px; }
  .icon-btn{ background:none; border:1px solid var(--card-line); color:var(--muted); font-size:10px; padding:5px 8px; cursor:pointer; }
  .icon-btn:hover{ border-color:var(--green); color:var(--green); }
  .empty-note{ font-size:11.5px; color:var(--muted); border:1px dashed var(--card-line); padding:14px; text-align:center; }

  .note{ max-width:1080px; margin:56px auto 0; border-top:1px solid var(--card-line); padding-top:22px; font-size:12.5px; color:var(--muted); line-height:1.7; }
  .note b{ color:var(--paper); font-weight:600; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ================= STORAGE HELPERS ================= */
const CUST_KEY = 'mrcc_customers';
const TOKEN_KEY = 'mrcc_tokens';
const TOTAL = 10;

function loadCustomers(){ try{ return JSON.parse(localStorage.getItem(CUST_KEY) || '{}'); }catch(e){ return {}; } }
function saveCustomers(c){ localStorage.setItem(CUST_KEY, JSON.stringify(c)); }
function loadTokens(){ try{ return JSON.parse(localStorage.getItem(TOKEN_KEY) || '{}'); }catch(e){ return {}; } }
function saveTokens(t){ localStorage.setItem(TOKEN_KEY, JSON.stringify(t)); }

function genToken(){
  return (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36)+Math.random().toString(36).slice(2)));
}

function getOrCreateCustomer(phone, name){
  const customers = loadCustomers();
  if(!customers[phone]){
    customers[phone] = { name: name || 'Customer', phone, stamps:0, lifetimeStamps:0, rewardReady:false, createdAt: Date.now() };
  } else if(name && name.trim() && customers[phone].name !== name.trim()){
    customers[phone].name = name.trim();
  }
  saveCustomers(customers);
  return customers[phone];
}

/* ================= CATALOG ================= */
const CATALOG = [
  { name: "Cotton Polo", price: 1900 },
  { name: "Drop Shoulder Tee", price: 1800 },
  { name: "Beige Chinos", price: 2400 },
  { name: "Classic Denim Jeans", price: 2800 },
  { name: "Formal Check Shirt", price: 2100 },
];
const checkIcon = `<svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#39ff88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const cardCheckIcon = `<svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#39ff88" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* ================= ROUTING ================= */
const params = new URLSearchParams(window.location.search);
const app = document.getElementById('app');

if(params.has('stamp')){
  renderCustomerScreen(handleStampToken(params.get('stamp')));
} else if(params.has('view')){
  renderCustomerScreen(viewCustomerReadonly(params.get('view')));
} else {
  renderPOSScreen();
}

/* ================= STAMP LOGIC ================= */
function handleStampToken(token){
  const tokens = loadTokens();
  const entry = tokens[token];
  if(!entry){ return { status:'not_found' }; }
  const customers = loadCustomers();
  const customer = customers[entry.phone];
  if(!customer){ return { status:'not_found' }; }

  if(entry.claimed){
    return { status:'already_claimed', customer, claimedAt: entry.claimedAt };
  }

  customer.stamps = Math.min(TOTAL, customer.stamps + 1);
  customer.lifetimeStamps = (customer.lifetimeStamps || 0) + 1;
  customer.rewardReady = customer.stamps >= TOTAL;
  entry.claimed = true;
  entry.claimedAt = Date.now();

  customers[entry.phone] = customer;
  tokens[token] = entry;
  saveCustomers(customers);
  saveTokens(tokens);

  return { status:'stamped', customer, animateIndex: customer.stamps - 1 };
}

function viewCustomerReadonly(phone){
  const customers = loadCustomers();
  const customer = customers[phone];
  if(!customer) return { status:'not_found' };
  return { status:'view', customer };
}

/* ================= POS SCREEN ================= */
function renderPOSScreen(){
  const customers = loadCustomers();
  const rows = Object.values(customers).sort((a,b)=>b.createdAt-a.createdAt);

  app.innerHTML = `
    <div class="eyebrow">MR CLOTHING CRAFT · POS MODULE CONCEPT</div>
    <h1>Digital Stamp Card</h1>
    <p class="sub">Staff bill banata hai, customer QR scan karta hai, stamp automatically add ho jata hai. Ye version localStorage mein save hota hai taake same device par test kiya ja sake.</p>

    <div class="stage">
      <div class="receipt-panel">
        <div class="panel-label">Staff POS — New Bill</div>

        <div class="pos-box" id="posBox">
          <div class="pos-title">Customer details</div>
          <div class="field-row">
            <label>Full name</label>
            <input type="text" id="nameInput" placeholder="e.g. Ahmed Raza">
          </div>
          <div class="field-row">
            <label>Phone number</label>
            <input type="tel" id="phoneInput" placeholder="e.g. 03001234567">
          </div>

          <div class="pos-title" style="margin-top:6px;">Select items</div>
          <div class="pos-list" id="posList"></div>
          <div class="pos-total-row"><span>Total</span><span id="posTotal">Rs. 0</span></div>
          <button class="btn btn-full" id="genBtn" disabled>Generate Bill &amp; QR</button>
        </div>

        <div class="receipt" id="receipt" style="display:none;">
          <div class="r-brand">MR Clothing Craft</div>
          <div class="r-tag">Wear Your Identity</div>
          <hr class="r-line">
          <div class="r-row"><span id="orderId">ORDER: —</span><span></span></div>
          <div class="r-row"><span id="custLine">Customer: —</span><span></span></div>
          <hr class="r-line">
          <div id="receiptItems"></div>
          <hr class="r-line">
          <div class="r-total"><span>Total</span><span id="receiptTotal">Rs. 0</span></div>
          <div class="qr-block">
            <div id="qrcode"></div>
            <div class="qr-caption">Scan to collect your stamp</div>
          </div>
        </div>
        <button class="btn btn-full" id="scanBtn" style="display:none; max-width:300px;">Open Customer's Stamp Card →</button>
        <button class="link-btn" id="newBillBtn" style="display:none; margin-top:14px;">Start a new bill</button>
      </div>

      <div class="phone-panel">
        <div class="panel-label">Preview</div>
        <div class="phone">
          <div class="notch"></div>
          <div class="screen" id="previewScreen">
            <div class="card-header">
              <div class="card-brand">MRCC Rewards</div>
              <div class="card-member">Generate a bill to preview</div>
            </div>
            <div class="progress-text" style="margin-top:20px;">Customer's card will appear here once you generate a bill and open the QR link.</div>
          </div>
        </div>

        <div class="testlist">
          <div class="testlist-head">
            <span class="testlist-title">Test customers (${rows.length})</span>
            ${rows.length ? '<button class="testlist-clear" id="clearAllBtn">Clear all</button>' : ''}
          </div>
          <div id="testRows">
            ${rows.length ? rows.map(c => testRowHtml(c)).join('') : '<div class="empty-note">Abhi koi test customer nahi. Bill generate karein to yahan dikhega.</div>'}
          </div>
        </div>
      </div>
    </div>

    <div class="note">
      <b>Nota bene:</b> Ye data sirf isi browser ki localStorage mein save ho raha hai — isi device/browser
      par test karne ke liye perfect hai. Agar customer apne alag phone se real QR scan karega, us device
      par ye data nahi milega jab tak asal POS backend/database connect na ho (spec file dekhein).
      Yahan "Open Customer's Stamp Card" button use karein — ye bilkul wahi flow chalata hai jo real scan par hota, isi browser ke andar.
    </div>
  `;

  // item list
  const posList = document.getElementById('posList');
  const selected = new Set();
  CATALOG.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'pos-item';
    row.innerHTML = `
      <div class="pos-item-name"><div class="pos-check">${checkIcon}</div><span>${item.name}</span></div>
      <span class="pos-price">Rs. ${item.price.toLocaleString()}</span>`;
    row.addEventListener('click', () => {
      if(selected.has(i)) selected.delete(i); else selected.add(i);
      row.classList.toggle('checked');
      updateTotal();
    });
    posList.appendChild(row);
  });

  const nameInput = document.getElementById('nameInput');
  const phoneInput = document.getElementById('phoneInput');
  const genBtn = document.getElementById('genBtn');

  function updateTotal(){
    let total = 0;
    selected.forEach(i => total += CATALOG[i].price);
    document.getElementById('posTotal').textContent = `Rs. ${total.toLocaleString()}`;
    genBtn.disabled = selected.size === 0 || !phoneInput.value.trim();
  }
  phoneInput.addEventListener('input', updateTotal);

  let lastQrUrl = '';

  genBtn.addEventListener('click', () => {
    const phone = phoneInput.value.trim();
    const name = nameInput.value.trim();
    if(!phone){ phoneInput.classList.add('err'); phoneInput.focus(); return; }
    phoneInput.classList.remove('err');

    const customer = getOrCreateCustomer(phone, name);
    const orderId = 'MRCC' + Math.floor(1000 + Math.random()*9000);
    const token = genToken();

    let total = 0;
    const itemsHtml = [...selected].map(i => {
      const item = CATALOG[i];
      total += item.price;
      return `<div class="r-row item"><span>1 · ${item.name}</span><span>${item.price.toLocaleString()}</span></div>`;
    }).join('');

    const tokens = loadTokens();
    tokens[token] = { phone, orderId, claimed:false, createdAt: Date.now() };
    saveTokens(tokens);

    document.getElementById('orderId').textContent = `ORDER: ${orderId}`;
    document.getElementById('custLine').textContent = `Customer: ${customer.name} · ${phone}`;
    document.getElementById('receiptItems').innerHTML = itemsHtml;
    document.getElementById('receiptTotal').textContent = `Rs. ${total.toLocaleString()}`;

    document.getElementById('posBox').style.display = 'none';
    document.getElementById('receipt').style.display = 'block';
    document.getElementById('scanBtn').style.display = 'block';
    document.getElementById('newBillBtn').style.display = 'inline-block';

    lastQrUrl = `${window.location.origin}${window.location.pathname}?stamp=${token}`;
    document.getElementById('qrcode').innerHTML = '';
    new QRCode(document.getElementById("qrcode"), {
      text: lastQrUrl, width: 108, height: 108,
      colorDark: "#0c0c0c", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M
    });

    refreshTestList();
  });

  document.getElementById('scanBtn').addEventListener('click', () => {
    if(lastQrUrl) window.open(lastQrUrl, '_blank');
  });

  document.getElementById('newBillBtn').addEventListener('click', () => {
    renderPOSScreen();
  });

  bindTestListEvents();
  updateTotal();
}

function testRowHtml(c){
  return `
    <div class="test-row" data-phone="${c.phone}">
      <div class="test-row-main">
        <span class="test-row-name">${c.name}</span>
        <span class="test-row-phone">${c.phone}</span>
      </div>
      <span class="test-row-stamps">${c.stamps}/${TOTAL}${c.rewardReady ? ' 🎉' : ''}</span>
      <div class="test-row-actions">
        <button class="icon-btn view-btn" data-phone="${c.phone}">View</button>
        <button class="icon-btn reset-btn" data-phone="${c.phone}">Reset</button>
      </div>
    </div>`;
}

function refreshTestList(){
  const customers = loadCustomers();
  const rows = Object.values(customers).sort((a,b)=>b.createdAt-a.createdAt);
  const container = document.getElementById('testRows');
  const head = document.querySelector('.testlist-title');
  if(head) head.textContent = `Test customers (${rows.length})`;
  if(!container) return;
  container.innerHTML = rows.length ? rows.map(c => testRowHtml(c)).join('') : '<div class="empty-note">Abhi koi test customer nahi. Bill generate karein to yahan dikhega.</div>';
  const clearBtn = document.getElementById('clearAllBtn');
  if(rows.length && !clearBtn){
    const wrap = document.querySelector('.testlist-head');
    const btn = document.createElement('button');
    btn.className = 'testlist-clear'; btn.id = 'clearAllBtn'; btn.textContent = 'Clear all';
    wrap.appendChild(btn);
  }
  bindTestListEvents();
}

function bindTestListEvents(){
  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.onclick = () => {
      const url = `${window.location.origin}${window.location.pathname}?view=${encodeURIComponent(btn.dataset.phone)}`;
      window.open(url, '_blank');
    };
  });
  document.querySelectorAll('.reset-btn').forEach(btn => {
    btn.onclick = () => {
      const customers = loadCustomers();
      const c = customers[btn.dataset.phone];
      if(c){ c.stamps = 0; c.rewardReady = false; saveCustomers(customers); refreshTestList(); }
    };
  });
  const clearBtn = document.getElementById('clearAllBtn');
  if(clearBtn){
    clearBtn.onclick = () => {
      localStorage.removeItem(CUST_KEY);
      localStorage.removeItem(TOKEN_KEY);
      renderPOSScreen();
    };
  }
}

/* ================= CUSTOMER SCREEN ================= */
function renderCustomerScreen(result){
  app.innerHTML = `
    <div class="eyebrow">MRCC REWARDS</div>
    <h1 style="font-size:26px;">Your Stamp Card</h1>
    <div style="max-width:290px;">
      <div class="phone">
        <div class="notch"></div>
        <div class="screen">
          <div class="flash" id="flash"></div>
          <div id="cardBody"></div>
        </div>
      </div>
      <div class="footer-link"><a class="link-btn" href="${window.location.origin}${window.location.pathname}" style="text-decoration:none;">← Back to POS (staff)</a></div>
    </div>
  `;

  const body = document.getElementById('cardBody');

  if(result.status === 'not_found'){
    body.innerHTML = `
      <div class="not-found">
        <div class="nf-icon">🔍</div>
        <h3>Card not found on this device</h3>
        <p>Ye link is browser mein pehchana nahi gaya. Demo abhi localStorage-based hai, isliye ye sirf usi device par kaam karega jahan bill banaya gaya tha. Real POS integration hone par har device par kaam karega.</p>
      </div>`;
    return;
  }

  const c = result.customer;
  body.innerHTML = `
    <div class="card-header">
      <div class="card-brand">MRCC Rewards</div>
      <div class="card-name">${c.name}</div>
      <div class="card-member">${c.phone}</div>
    </div>
    <div class="stamp-grid" id="stampGrid"></div>
    <div class="progress-text" id="progressText"></div>
    <div class="reward-box" id="rewardBox">
      <div class="reward-title" id="rewardTitle"></div>
      <div class="reward-sub" id="rewardSub"></div>
    </div>
    ${result.status === 'already_claimed' ? '<div class="status-note">Ye stamp pehle hi add ho chuka tha.</div>' : ''}
  `;

  const grid = document.getElementById('stampGrid');
  for(let i=0;i<TOTAL;i++){
    const d = document.createElement('div');
    d.className = 'stamp' + (i < c.stamps ? ' filled' : '');
    d.innerHTML = cardCheckIcon;
    grid.appendChild(d);
  }

  const remaining = TOTAL - c.stamps;
  const progressText = document.getElementById('progressText');
  const rewardBox = document.getElementById('rewardBox');
  const rewardTitle = document.getElementById('rewardTitle');
  const rewardSub = document.getElementById('rewardSub');

  if(c.rewardReady){
    progressText.innerHTML = `<b>Reward unlocked 🎉</b>`;
    rewardBox.classList.add('ready');
    rewardTitle.textContent = 'Reward Unlocked';
    rewardSub.textContent = 'Show this screen in-store to redeem 10% off your next purchase.';
  } else {
    progressText.innerHTML = `<b>${remaining}</b> stamp${remaining===1?'':'s'} away from your reward`;
    rewardTitle.textContent = 'Keep shopping';
    rewardSub.textContent = 'Collect 10 stamps to unlock 10% off your next purchase.';
  }

  if(result.status === 'stamped'){
    const flash = document.getElementById('flash');
    flash.classList.add('go');
    const cell = grid.children[result.animateIndex];
    if(cell){ cell.classList.add('pop'); setTimeout(()=>cell.classList.remove('pop'), 500); }
  }
}
</script>
